providers = []

[variables]
VITE_API_URL = "/api"
VITE_WS_URL = ""
VITE_ENABLE_MOCKS = "true"
VITE_MOCK_SCENARIO = "default"

[phases.setup]
nixPkgs = ["bun", "caddy"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "caddy run --config Caddyfile --adapter caddyfile"
